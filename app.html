<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="assets/RPM_logo.png">
  <meta charset="UTF-8">
  <title>Retropixel Messenger™</title>
  <link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#4a90d9">

<link rel="apple-touch-icon" href="assets/icon-192.png">
</head>

<body class="rp-bg">

  <div class="messenger-window">

    <div class="top-bar">
      Retropixel Messenger™

      <div>
        <button id="sobreBtn">Sobre</button>
        <button id="configBtn">Configurações</button>
        <button id="termosBtn">Termos</button>
        <button id="logoutBtn">Sair</button>
      </div>
    </div>

    <div class="messenger-body">

      <div class="contacts-panel">
        <div class="user-info">🟢 Online</div>

        <button class="add-contact-btn" id="addContactBtn">
          ➕ Adicionar contato
        </button>

        <div id="contacts" class="contacts-list"></div>
      </div>

      <div class="chat-panel">

        <div id="chatTitle" class="chat-header">
          Selecione um contato
        </div>

        <div id="messages" class="messages"></div>

        <div class="chat-input">
          <input id="messageInput" placeholder="Digite uma mensagem...">
          <button id="sendBtn">Enviar</button>
          <button id="nudgeBtn">⚡</button>
        </div>

      </div>

    </div>

  </div>

  <!-- 🔊 ÁUDIOS -->
  <audio id="clickSound" src="assets/click.wav" preload="auto"></audio>
  <audio id="nudgeSound" src="assets/nudge.wav" preload="auto"></audio>
  <audio id="nudgeSound" src="assets/aeroclick.wav" preload="auto"></audio>

  <script type="module" src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("✅ Service Worker registrado"))
        .catch(err => console.error("❌ Erro:", err));
}
</script>

</body>
</html>
