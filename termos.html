<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="assets/RPM_logo.png">
  <meta charset="UTF-8">
  <title>Termos</title>
  <link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#4a90d9">

<link rel="apple-touch-icon" href="assets/icon-192.png">
</head>

<body class="rp-bg">

  <div class="rp-window">
    <div class="rp-title">Termos de Serviço</div>

    <div class="rp-content">

      <p>Ao usar o Retropixel Messenger™, você concorda com:</p>

      <ul>
        <li>Uso responsável</li>
        <li>Sem spam</li>
        <li>Respeito aos usuários</li>
      </ul>

      <button onclick="location.href='app.html'">Voltar</button>

    </div>
  </div>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("✅ Service Worker registrado"))
        .catch(err => console.error("❌ Erro:", err));
}
</script>

</body>
</html>
